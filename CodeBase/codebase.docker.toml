# Конфиг для запуска в Docker (Linux-пути, хост БД = имя сервиса)

root_path = "/data/FA/fa-contracts"

[database]
host = "postgres"
port = 5432
database = "codebase"
user = "postgres"
password = "postgres"
sslmode = "disable"
connect_timeout = 10
max_open_conns = 25
max_idle_conns = 25
conn_max_lifetime = "5m"

[indexer]
parallel = 12
batch_size = 1000
batch_insert_size = 50000
progress_interval_ms = 500
include_patterns = [
    "*.sql", "*.h", "*.pas", "*.inc", "*.js",
    "*.smf", "*.dfm", "*.tpr", "*.rpt", "*.xml"
]
exclude_patterns = ["*/.*", "*~", "*.bak", "*.old", "*/archive/*", "*/backup/*"]

[logging]
command_enabled = true

[query]
default_limit = 100
max_limit = 1000

[rti]
slow_threshold_ms = 100
top_slow_count = 10

[trc]
slow_threshold_ms = 100
max_enrich_workers = 16
min_procs_for_parallel_enrich = 16

[mcp]
pagination_chunk_size = 8000
pagination_ttl = "15m"
query_timeout_sec = 30
review_timeout_sec = 120
